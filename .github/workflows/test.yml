name: test

# CI gate: type-check, unit + RLS test collection, and a production build must
# all pass on every PR and push. The RLS integration tests only *exercise* a
# live database when SUPABASE_TEST_URL (+ keys) are provided as repo secrets;
# without them the suite collects and passes-as-skipped, so this workflow is
# green out of the box with no secrets configured.
on:
  pull_request:
  push:

# Cancel superseded runs ONLY for PR iterations (pushing a new commit to an open
# PR supersedes the prior run — cheap to drop). NEVER cancel push runs on a
# branch: rapid merges to main were cancelling each other's post-merge run, so
# a merge could land with its authoritative test run cancelled — GitHub then
# shows no failing check and the branch reads "green" even though CI never
# completed on that commit (this masked real lint failures on main). Per-SHA
# grouping + no-cancel on branch pushes guarantees every merged commit gets a
# definitive pass/fail.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT available in step-level `if:` expressions —
    # referencing it there makes the whole workflow fail to compile (0 jobs
    # created, "workflow file issue"). Hoist the gate into a job-level env var,
    # which IS allowed in `if:`.
    env:
      HAS_TEST_DB: ${{ secrets.SUPABASE_TEST_URL != '' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-workspace.yaml here is v10+-style config-only (allowBuilds,
          # no `packages` field) — pnpm 9 errors on it ("packages field
          # missing or empty"), which is why this workflow never went green.
          # Local dev runs pnpm 11 via corepack; lockfileVersion 9.0 is
          # compatible.
          version: 11

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (uses node:sqlite in its cache probe).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + RLS tests
        run: pnpm test
        env:
          # RLS integration tests (tests/rls/*) skip unless these are set.
          # When the secrets are absent GitHub substitutes empty strings, the
          # skipIf guards fire, and the suite passes-as-skipped. Populate the
          # secrets to actually exercise the policies against a real project.
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          # Legacy gate + var names still honoured by the pre-existing rls.test.ts.
          RUN_RLS_TESTS: ${{ secrets.SUPABASE_TEST_URL != '' && '1' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}

      - name: Production build
        run: pnpm build
        env:
          # next build strictly parses NEXT_PUBLIC_* client env (lib/env.ts uses
          # z.url()). Provide harmless placeholders so a build without secrets
          # still succeeds; these never reach a deployed artifact from CI.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY || 'placeholder-anon-key' }}

      # E2E only runs when a real test database is configured — several specs
      # hit DB-backed API routes that 500 against placeholder credentials. Same
      # secret gate as the RLS tests above.
      - name: Install Playwright browser
        if: ${{ env.HAS_TEST_DB != '' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        if: ${{ env.HAS_TEST_DB != '' }}
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}

      # Privacy audit gate (agents.md DoD) — needs the service role to list
      # buckets, so it too is gated on the test DB secret.
      - name: Privacy audit
        if: ${{ env.HAS_TEST_DB != '' }}
        run: pnpm audit:privacy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
