name: migrations

# Fresh-deploy migration gate.
#
# Migrations are applied incrementally against the live project, so a file can
# be broken in ways nobody notices until someone stands up a NEW database. That
# already happened once: 33ec7d9 had to recover DDL that existed live but in no
# migration file, and fix two files that had been given the same sequence
# number. Nothing stopped a repeat.
#
# This job applies every migration, in order, to an empty Postgres with PostGIS
# — the same thing a new city deployment does — and fails if any file errors.
# It needs no secrets, so it runs on every PR and push.
#
# What it deliberately does NOT do: assert the resulting schema matches the live
# project. That would need production credentials in CI. This answers the
# narrower, still-valuable question — "would a fresh deploy succeed?"

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations.yml"
  # Scoped to main for the same reason as test.yml: a branch with an open PR
  # fires both `push` and `pull_request` on the same commit, so this replayed
  # all 77 migrations into a fresh PostGIS container twice per push.
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations.yml"

concurrency:
  group: migrations-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege — see the same block in test.yml. This job only reads
# supabase/migrations/ and replays it into a throwaway container.
permissions:
  contents: read

jobs:
  fresh-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostGIS is not optional here: every location column is
        # geography(POINT,4326), so a plain postgres image fails on migration 1.
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civic_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migration numbering
        run: |
          # Two files sharing a sequence number makes rollback ambiguous and
          # breaks any tooling that derives "the next number" from the set.
          dupes=$(ls supabase/migrations/*.sql \
            | sed -E 's|.*/[0-9]{8}_([0-9]+[a-z]?)_.*|\1|' \
            | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration sequence number(s):"
            echo "$dupes"
            echo "Known: 056 is used by both routing_decisions and video_pipeline."
            echo "Renaming an APPLIED migration is its own risk — the tracking"
            echo "table keys on filename — so this is a warning, not a failure."
          else
            echo "No duplicate sequence numbers."
          fi

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply every migration to an empty database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d civic_fresh -v ON_ERROR_STOP=1 --quiet"

          # Supabase provides these roles and the auth schema; a bare Postgres
          # does not, so stand in for them. Without this every RLS policy that
          # references authenticated/anon fails, and every `auth.uid()` call
          # errors — neither of which is a real defect in the migration.
          $PSQL <<'SQL'
            create extension if not exists postgis;
            create extension if not exists pgcrypto;
            do $$ begin
              if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
              if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
              if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin bypassrls; end if;
            end $$;
            create schema if not exists auth;
            create schema if not exists storage;
            create schema if not exists extensions;
            -- The helpers Supabase injects. Anything a migration calls has to
            -- exist here or the file fails for a reason that is about this
            -- harness, not about the migration.
            create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
            create or replace function auth.role() returns text language sql stable as $$ select 'service_role'::text $$;
            create or replace function auth.email() returns text language sql stable as $$ select null::text $$;
            create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
            create table if not exists auth.users (
              id uuid primary key default gen_random_uuid(),
              email text,
              raw_user_meta_data jsonb default '{}'::jsonb,
              created_at timestamptz default now()
            );
            create table if not exists storage.buckets (
              id text primary key, name text, public boolean default false,
              created_at timestamptz default now()
            );
            create table if not exists storage.objects (
              id uuid primary key default gen_random_uuid(),
              bucket_id text, name text, owner uuid,
              created_at timestamptz default now(),
              updated_at timestamptz default now(),
              metadata jsonb default '{}'::jsonb
            );
            -- storage.foldername('a/b/c.jpg') -> {a,b}; used by the folder-scoped
            -- storage policies.
            create or replace function storage.foldername(name text)
              returns text[] language sql immutable as
              $$ select string_to_array(regexp_replace(name, '/[^/]*$', ''), '/') $$;
            -- Supabase ships this publication; migrations add tables to it to
            -- turn on Realtime. Without it, `alter publication supabase_realtime
            -- add table ...` aborts the whole file.
            do $$ begin
              if not exists (select 1 from pg_publication where pubname='supabase_realtime') then
                create publication supabase_realtime;
              end if;
            end $$;
          SQL

          failed=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f")
            # pg_cron is a project-level extension the CI image does not carry,
            # and these two schedule recurring DELETEs. They are OWNER-APPLY by
            # design (see the header of each file), so skip rather than fail.
            case "$base" in
              *_039_raw_photo_retention.sql|*_069_video_frame_retention.sql)
                echo "SKIP  $base (owner-apply: needs pg_cron)"
                continue
                ;;
            esac
            printf 'APPLY %s ... ' "$base"
            if $PSQL -f "$f" >/dev/null 2>/tmp/err; then
              echo ok
            else
              echo FAILED
              sed 's/^/      /' /tmp/err | head -12
              failed=$((failed + 1))
            fi
          done

          echo
          if [ "$failed" -gt 0 ]; then
            echo "$failed migration(s) failed against an empty database."
            echo "A new city deployment would not come up. Fix the file, not the live DB."
            exit 1
          fi
          echo "All migrations applied cleanly to a fresh database."

      - name: Assert RLS is enabled on every public table
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # agents.md hard rule 3: RLS on every table, default deny. A table
          # shipped without it is the single easiest way to leak a tenant's data.
          # Excludes tables owned by an extension: PostGIS installs
          # spatial_ref_sys into public and we neither can nor should enable RLS
          # on it. Only tables this repo creates are in scope.
          missing=$(psql -h localhost -U postgres -d civic_fresh -tAc "
            select string_agg(c.relname, ', ' order by c.relname)
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relkind = 'r'
              and not c.relrowsecurity
              and not exists (
                select 1 from pg_depend d
                where d.objid = c.oid
                  and d.deptype = 'e'
              )
          ")
          if [ -n "$missing" ]; then
            echo "Tables in public with RLS DISABLED: $missing"
            exit 1
          fi
          echo "Every public table has row-level security enabled."
